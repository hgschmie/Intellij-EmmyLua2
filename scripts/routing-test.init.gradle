settingsEvaluated { settings ->
    settings.pluginManagement.resolutionStrategy.eachPlugin {
        if (requested.id.id == 'org.jetbrains.intellij.platform') useVersion('2.18.1')
    }
}
allprojects {
    tasks.withType(Test).configureEach {
        systemProperty 'idea.load.plugins.id', 'com.cppcxy.Intellij-EmmyLua,com.redhat.devtools.lsp4ij'
    }
}
